<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Microsoft JhengHei,Segoe UI,sans-serif">
<style>
  .t{font-size:15px;font-weight:bold;fill:#0f172a}
  .s{font-size:11.5px;fill:#334155}
  .h{font-size:13px;font-weight:bold;fill:#0f172a}
  .bad{font-size:12px;fill:#b91c1c}
  .good{font-size:12px;fill:#15803d}
  .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:6}
  .badbox{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5;rx:6}
  .goodbox{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:6}
  .priv{fill:#fffbeb;stroke:#d97706;stroke-width:1.5;rx:6}
  .pub{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:6}
  .mask{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5;rx:6}
  .hd{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
  .ok{font-size:11.5px;fill:#15803d}
  .no{font-size:11.5px;fill:#b91c1c}
  .c1{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8}
  .c2{fill:#fffbeb;stroke:#d97706;stroke-width:1.8}
  .c3{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8}
</style>
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="28" class="t" text-anchor="middle">三個 Browser Skill Repo 方案比較（本機實測）</text>

<rect x="30" y="45" width="260" height="345" class="c1"/>
<text x="160" y="70" class="h" fill="#15803d" text-anchor="middle">anomalyco/browser-control</text>
<text x="160" y="88" class="s" text-anchor="middle">＝本機既有（v0.8.4）</text>
<text x="45" y="112" class="ok">✓ 沿用既有登入態</text>
<text x="45" y="132" class="ok">✓ Playwright 任意 JS</text>
<text x="45" y="152" class="ok">✓ 27 支 MCP 工具</text>
<text x="45" y="172" class="ok">✓ 憑證遮蔽 + HAR</text>
<text x="45" y="192" class="ok">✓ 錄影 + flight recorder</text>
<text x="45" y="212" class="ok">✓ npm 一鍵安裝</text>
<text x="45" y="236" class="no">✗ repo 已封存（2026-11-07）</text>
<text x="45" y="256" class="no">✗ 0.8.4 缺 plugin 入口</text>
<text x="45" y="276" class="no">✗ 套件停滯於 2026-10-06</text>
<rect x="45" y="296" width="230" height="78" class="hd"/>
<text x="58" y="316" class="s">結論：維持 + 修復</text>
<text x="58" y="334" class="s">手動註冊 MCP 繞開缺陷</text>
<text x="58" y="352" class="s">實測：CLI + MCP 皆可用</text>

<rect x="320" y="45" width="260" height="345" class="c2"/>
<text x="450" y="70" class="h" fill="#b45309" text-anchor="middle">Tencent/BrowserSkill</text>
<text x="450" y="88" class="s" text-anchor="middle">＝功能最齊全（10.3k star）</text>
<text x="335" y="112" class="ok">✓ 網站除錯 evidence 工作區</text>
<text x="335" y="132" class="ok">✓ 表格 JSON/CSV 抽取</text>
<text x="335" y="152" class="ok">✓ 反注入規範（明列判準）</text>
<text x="335" y="172" class="ok">✓ 共享控制（可搶回）</text>
<text x="335" y="192" class="ok">✓ 遠端 WSS 配對</text>
<text x="335" y="212" class="ok">✓ 0.4.2 剛加 MCP</text>
<text x="335" y="236" class="no">✗ Chrome Web Store 被擋（000）</text>
<text x="335" y="256" class="no">✗ 需另裝 bsk + 第二個擴充</text>
<text x="335" y="276" class="no">✗ 兩擴充同掛會互斥</text>
<rect x="335" y="296" width="230" height="78" class="hd"/>
<text x="348" y="316" class="s">結論：可選並存</text>
<text x="348" y="334" class="s">需除錯／抽取時才裝</text>
<text x="348" y="352" class="s">Edge Add-ons 可達（200）</text>

<rect x="610" y="45" width="260" height="345" class="c3"/>
<text x="740" y="70" class="h" fill="#b91c1c" text-anchor="middle">keon/browser-control</text>
<text x="740" y="88" class="s" text-anchor="middle">＝自帶瀏覽器（3.2k star）</text>
<text x="625" y="112" class="ok">✓ 權限最小（不碰使用者）</text>
<text x="625" y="132" class="ok">✓ 雲端瀏覽器支援</text>
<text x="625" y="152" class="ok">✓ 原始 CDP 逃生門</text>
<text x="625" y="176" class="no">✗ 拿不到既有登入態</text>
<text x="625" y="196" class="no">✗ 無 Windows 預編譯</text>
<text x="625" y="216" class="no">✗ 需 Rust（本機無 toolchain）</text>
<text x="625" y="236" class="no">✗ crates.io API 被擋（403）</text>
<text x="625" y="256" class="no">✗ repo 僅 3 commits</text>
<text x="625" y="276" class="no">✗ crate 停滯 2026-06</text>
<rect x="625" y="296" width="230" height="78" class="hd"/>
<text x="638" y="316" class="s">結論：不採用</text>
<text x="638" y="334" class="s">喪失本機最核心需求</text>
<text x="638" y="352" class="s">（沿用登入態）</text>
</svg>