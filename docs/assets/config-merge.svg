<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Microsoft JhengHei,Segoe UI,sans-serif">
<defs>
  <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#334155"/>
  </marker>
</defs>
<style>
  .t{font-size:15px;font-weight:bold;fill:#0f172a}
  .s{font-size:11.5px;fill:#334155}
  .h{font-size:13px;font-weight:bold;fill:#0f172a}
  .bad{font-size:12px;fill:#b91c1c}
  .good{font-size:12px;fill:#15803d}
  .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:6}
  .badbox{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5;rx:6}
  .goodbox{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:6}
  .priv{fill:#fffbeb;stroke:#d97706;stroke-width:1.5;rx:6}
  .pub{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:6}
  .mask{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5;rx:6}
  .hd{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
  .ok{font-size:11.5px;fill:#15803d}
  .no{font-size:11.5px;fill:#b91c1c}
  .c1{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8}
  .c2{fill:#fffbeb;stroke:#d97706;stroke-width:1.8}
  .c3{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8}
</style>
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="30" class="t" text-anchor="middle">全域設定檔合併：修正前 → 修正後</text>

<text x="30" y="70" class="t">修正前（2026-11-11 前）</text>
<rect x="30" y="85" width="380" height="205" class="badbox"/>
<text x="45" y="108" class="bad">✗ opencode.json（實體檔）</text>
<text x="55" y="126" class="s">"plugins": [ "@opencode-ai/browser-control" ]</text>
<text x="55" y="144" class="s">"permissions": [ {action,resource,effect} ]</text>
<text x="45" y="168" class="bad">✗ opencode.jsonc（符號連結）</text>
<text x="55" y="186" class="s">"plugin": [ ... ]  ← V1 已 deprecated</text>
<text x="55" y="204" class="s">"mcp": { ... }  ← 舊式結構</text>
<text x="45" y="228" class="bad">✗ 兩檔皆被載入並合併</text>
<text x="55" y="246" class="s">→ plugin 與 plugins 同時宣告</text>
<text x="55" y="264" class="s">→ 套件 0.8.4 缺 plugin 入口</text>
<text x="55" y="280" class="s">→ 每次啟動噴 WARN，MCP 未註冊</text>

<text x="490" y="70" class="t">修正後</text>
<rect x="490" y="85" width="380" height="205" class="goodbox"/>
<text x="505" y="108" class="good">✓ opencode.jsonc（單一來源）</text>
<text x="515" y="126" class="s">"plugins": [ {package, options} ]  ← V2 物件格式</text>
<text x="515" y="144" class="s">"permissions": [ {action,resource,effect} ]</text>
<text x="515" y="162" class="s">"mcp": { "servers": { browser_control, … } }</text>
<text x="505" y="190" class="good">✓ opencode.json 已移出（.disabled）</text>
<text x="515" y="208" class="s">→ 消除 plugin / plugins key 衝突</text>
<text x="505" y="232" class="good">✓ 結果</text>
<text x="515" y="250" class="s">→ browser_control MCP connected</text>
<text x="515" y="268" class="s">→ 無 normalization diagnostic</text>
<text x="515" y="280" class="s">→ 無 failed to load plugin</text>

<line x1="450" y1="185" x2="482" y2="185" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

<rect x="30" y="310" width="840" height="185" class="box"/>
<text x="45" y="335" class="t">實際驗證（opencode mcp list / server log）</text>
<text x="45" y="358" class="good">✓ browser_control    connected      （0.8.4 CLI，25 支工具）</text>
<text x="45" y="378" class="good">✓ chrome-devtools    connected</text>
<text x="45" y="398" class="good">✓ open-computer-use  connected</text>
<text x="45" y="424" class="bad">✗ 仍存在（既有問題，非本次變更造成）</text>
<text x="55" y="444" class="s">opencode-auto-name v0.1.3 是 V1 plugin（export default 為 function），</text>
<text x="55" y="462" class="s">V2 要求 object + id + setup → 自 2026-10-05 起已失敗 2386 次</text>
</svg>